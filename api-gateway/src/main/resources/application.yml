server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: leave-service
          uri: lb://leave-service
          predicates:
            - Path=/leaves/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,gateway
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.assignment: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: ${LOGGING_LEVEL_GATEWAY:INFO}
