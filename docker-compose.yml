services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    ports:
      - "12201:12201/udp"
      - "5044:5044"
    volumes:
      - ./elk/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    ports:
      - "8761:8761"
    environment:
      APP_ENV: local
      SPRING_PROFILES_ACTIVE: docker
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - logstash

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      APP_ENV: local
      SPRING_PROFILES_ACTIVE: docker
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      EUREKA_URL: http://discovery-service:8761/eureka
      JWT_SECRET: change-this-secret-key-change-this-secret-key
    depends_on:
      - discovery-service
      - logstash

  leave-service:
    build:
      context: .
      dockerfile: leave-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      APP_ENV: local
      SPRING_PROFILES_ACTIVE: docker
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      EUREKA_URL: http://discovery-service:8761/eureka
      JWT_SECRET: change-this-secret-key-change-this-secret-key
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - discovery-service
      - rabbitmq
      - logstash

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      APP_ENV: local
      SPRING_PROFILES_ACTIVE: docker
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      EUREKA_URL: http://discovery-service:8761/eureka
      JWT_SECRET: change-this-secret-key-change-this-secret-key
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - discovery-service
      - rabbitmq
      - logstash

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      SPRING_PROFILES_ACTIVE: docker
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      EUREKA_URL: http://discovery-service:8761/eureka
    depends_on:
      - discovery-service
      - auth-service
      - leave-service
      - notification-service
      - logstash

volumes:
  elasticsearch-data:
