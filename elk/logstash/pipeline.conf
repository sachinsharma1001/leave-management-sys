input {
  tcp {
    port => 5000
    codec => json_lines
  }

  gelf {
    port => 12201
  }
}

filter {
  if [short_message] {
    json {
      source => "short_message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if ![app] and [service] {
    mutate {
      copy => {
        "service" => "[app][service]"
        "environment" => "[app][environment]"
        "level" => "[app][level]"
        "logger_name" => "[app][logger_name]"
        "thread_name" => "[app][thread_name]"
        "traceId" => "[app][traceId]"
        "spanId" => "[app][spanId]"
        "message" => "[app][message]"
      }
    }
  }

  if [app][timestamp] {
    date {
      match => ["[app][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    replace => {
      "service" => "%{[app][service]}"
      "environment" => "%{[app][environment]}"
      "level" => "%{[app][level]}"
      "logger" => "%{[app][logger_name]}"
      "thread" => "%{[app][thread_name]}"
      "traceId" => "%{[app][traceId]}"
      "spanId" => "%{[app][spanId]}"
      "message" => "%{[app][message]}"
    }
  }

  if [service] =~ /%\{/ {
    mutate {
      replace => { "service" => "docker" }
    }
  }

  if [traceId] =~ /%\{/ {
    mutate {
      remove_field => ["traceId"]
    }
  }

  if [spanId] =~ /%\{/ {
    mutate {
      remove_field => ["spanId"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "leave-management-%{+YYYY.MM.dd}"
  }
}
