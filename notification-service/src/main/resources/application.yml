server:
  port: 8083
spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
app:
  notification:
    exchange: leave.exchange
    queue: leave.notifications
    routing-key: leave.notification
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.assignment: ${LOGGING_LEVEL_APP:INFO}
